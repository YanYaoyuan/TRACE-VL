internal_controls:
- same_backbones_without_new_st
- recent_window_without_persistent_memory
- equal_latent_token_summary
- capsule_memory_fifo
- capsule_memory_learned_write
- single_rule_mlp_vs_candidate_conditioned_decisions
comparison_tracks:
  controlled_budget:
    frame_caps_proposed:
    - 32
    - 64
    - 128
    requires: same visible source timeline and documented sampling; report actual
      pixels/tokens and preprocessing
  native_protocol:
    requires: author settings and supported tasks explicitly reported; separate from
      controlled-budget table
temporal_rules:
  ovo: Official current edition. Forward tasks advance the stream; each attempt sees
    only frames available at its decision time.
  streamingbench_60s: Reset all state at max(0, query_time - 60). Old latent memory
    must not carry older evidence.
  streamingbench_full_history: Separate track with prefix state through current decision
    time.
  videomme: Offline full-video cutoff; no subtitles/audio in primary track.
reporting:
  baseline_scores: separate reproduced and paper-reported panels; never invent missing
    scores
  missing_tasks: N/A plus coverage; never silently drop tasks from total
  timing:
  - video_ingest_compute
  - query_latency_p50_p95
  - end_to_end_latency_with_decode_separate
  - total_compute_per_video_across_all_queries
  resources:
  - gpu_model
  - peak_allocated_and_reserved_bytes
  - actual_visual_token_count
  - sampled_frames_and_resolution
  - stream_state_bytes
  uncertainty: Paired bootstrap by source video; independent training seeds for trainable
    variants.
