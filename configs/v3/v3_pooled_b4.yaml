# Baseline B4: identical to v3_tkm (CST, I-steps every 8, memory policy) but P-steps send a fixed grid of
# average-pooled frame tokens instead of gist + before/after/delta tokens. Set pooled_tokens to the
# transition run's measured P-step tokens (held-out mean was 37.2 tokens/step incl. I-steps in the local
# 200-step run; use the P-step mean from metrics, rounded to a factorable count such as 32 or 36).
extends: v3_tkm.yaml
transition:
  p_step_mode: pooled
  pooled_tokens: 32
