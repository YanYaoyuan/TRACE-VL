# Baseline B4 (clean representation ablation): identical to v3_tkm, including the slot machinery that feeds
# CST memory and transition clocks; only the LM-facing P-step tokens differ. With pooled_match (default)
# each P-step emits exactly as many average-pooled frame-region tokens as the transition branch would emit
# on that step, so the visual-token budget is matched by construction. Audit with `trace-vl v3 budget`.
extends: v3_tkm.yaml
transition:
  p_step_mode: pooled
  pooled_match: true
