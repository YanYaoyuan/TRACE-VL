name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - run: uv sync --locked --extra dev --extra hf --extra track  # transformers: Stage 2 cache tests; wandb: offline SDK tests
      - run: uv run --locked --extra dev --extra hf --extra track pytest -q
      - run: uv run --locked ruff check src tests scripts
      - run: bash scripts/smoke.sh
