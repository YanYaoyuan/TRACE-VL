name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: uv sync --locked --extra dev --extra hf --extra lora --extra track
      - run: uv run --locked --extra dev --extra hf --extra lora --extra track pytest -q
      - run: uv run --locked --extra dev --extra hf --extra lora --extra track ruff check src tests scripts
      - run: bash scripts/smoke.sh
